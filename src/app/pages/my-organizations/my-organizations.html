<section class="min-h-screen pt-24 pb-16 flex items-center justify-center bg-sumar">
    <div class="w-3/5 bg-white p-8 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-4 logo">Mis Organizaciones</h1>
        <p class="mb-3">Aquí puedes ver y gestionar tus organizaciones.</p>

        <!-- grilla -->
        @if(isLoading()){
        <div class="flex justify-center items-center">
            <span class="loading loading-spinner text-primary loading-md"></span>
        </div>
        }
        @else {
        @if(errorMessage()){
        <div role="alert" class="alert alert-error alert-soft col-span-2">
            <span>{{ errorMessage() }}</span>
        </div>
        }
        @else {
        <div class="grid grid-cols-1 gap-4">
            <!-- organizacion -->
            @for (org of organizations; track $index) {
            <div class="border-2 border-violet-300 rounded-2xl p-4 mb-2 shadow-md">
                <div class="flex justify-between">
                    <h4 class="text-2xl mb-2 font-bold text-violet-400">{{ org.name }}</h4>
                    <div class="badge badge-lg " [ngClass]="statusClass(org.status!)">{{ statusName(org.status!) }}
                    </div>
                </div>

                <p class="text-gray-400 mb-2">{{ org.description | truncate }}</p>

                <div class="flex justify-end">
                    <app-button-component label="Ver más" variant="violet" [rounded]="true" (click)="redirect(org.ngoId)"></app-button-component>
                </div>
            </div>
            }
        </div>
        }
        }
        
    </div>

</section>
