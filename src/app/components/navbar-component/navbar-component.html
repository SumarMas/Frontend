<div class="navbar bg-white fixed z-50 shadow">
    @if (sidebarService.isLoggedIn()) {
    <button class="btn btn-square btn-ghost mr-4" (click)="sidebarService.toggle()">
        <!-- menu hamburguesa -->
        <icon name="menu" class="text-gray-500" size="lg" />

    </button>
    }

    <div class="flex justify-between w-full pl-4">
        <a href="" class="logo">Sumar+</a>

        <ul class="nav-links">
            <li><a class="nav-a" routerLink="/home" routerLinkActive="active">Inicio</a></li>
            <li><a class="nav-a" routerLink="/campaigns/all" routerLinkActive="active">Campañas</a></li>
            <li><a class="nav-a" routerLink="/organizations/all" routerLinkActive="active">Organizaciones</a></li>
        </ul>

        <div class="actions">
            @if(!isLoggedIn()){
                <app-button-component label="Iniciar Sesión" variant="violet" [rounded]="true" (onClick)="navigate('/login')" />
            }
            @else {
                <div class="flex text-center items-center gap-4">
                    <p class="bg-clip-text text-transparent bg-gradient-to-r 
                    from-violet-600 to-purple-600 font-medium">Bienvenido/a {{ authService._userName() }}</p>
                <app-notification-component></app-notification-component>
                </div>
            }
        </div>
    </div>
</div>
