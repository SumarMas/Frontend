<input type="text" id="tag-input" placeholder="Añada tags para facilitar la búsqueda..." class="input w-full"
    [(ngModel)]="tagValue" (keyup.enter)="addTag()" />
@if(tags.length > 0) {
<div class="flex flex-wrap gap-2 m-2 w-full">
    @for (tag of tags; track $index) {
    <span class="badge badge-lg bg-violet-500 text-white">{{tag}}<icon class="hover:cursor-pointer" name="close"
            size="sm" (click)="removeTag($index)"></icon></span>
    }
</div>
}
