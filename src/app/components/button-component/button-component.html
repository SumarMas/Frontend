<div [attr.data-tip]="tooltip() || null" [ngClass]="tooltipClasses">
    <button [disabled]="disabled() || isLoading()" [ngClass]="classes" (click)="handleClick()">
        @if (isLoading()) {
        <span class="loading loading-spinner loading-xs"></span>
        }
        @if (icon()){
        <icon [name]="icon()!" class="inline-block" [ngClass]="colorIcon()" />
        }
        {{ label() }}
    </button>
</div>
