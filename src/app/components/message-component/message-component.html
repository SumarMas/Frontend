<div class="card bg-white shadow-xl hover:shadow-2xl transition-all duration-300 border-t-4 border-violet-500 mb-6 overflow-hidden">
    <!-- Header con gradiente -->
    <div class="bg-gradient-to-r from-violet-50 to-purple-50 px-6 py-4 border-b border-violet-100">
        <div class="flex justify-between items-start gap-4">
            <div class="flex-1">
                <h2 class="text-2xl font-bold text-gray-800 mb-1">{{ message?.title }}</h2>
                <div class="flex items-center gap-2 text-sm text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <span>{{ message?.creationDateTime | date: 'fullDate':'':'es-AR' }}</span>
                </div>
            </div>
            
            @if(authService.roles().includes('ADMIN') || authService.roles().includes('ORGANIZATION')) {
            <div class="flex-shrink-0">
                <app-button-component 
                    icon="delete" 
                    variant="error" 
                    size="sm" 
                    [outline]="true"
                    (onClick)="ask()">
                </app-button-component>
            </div>
            }
        </div>
    </div>

    <!-- Contenido -->
    <div class="card-body p-6">
        <p class="text-gray-700 leading-relaxed text-base whitespace-pre-line">{{ message?.description }}</p>

        @if(message?.fileId && messageImageUrl()){
        <div class="mt-6 rounded-xl overflow-hidden bg-white flex items-center justify-center">
            <img 
                class="w-full max-h-96 object-contain" 
                [src]="messageImageUrl()!" 
                alt="Imagen de actualización">
        </div>
        }
    </div>

    <!-- Footer con badge de actualización -->
    <div class="px-6 pb-4">
        <div class="flex items-center gap-2">
            <span class="badge badge-outline badge-sm text-violet-600 border-violet-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Actualización de campaña
            </span>
        </div>
    </div>
</div>
