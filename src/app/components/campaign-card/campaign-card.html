<div class="flex flex-col rounded-2xl h-64 shadow-lg hover:shadow-violet-300 transition-shadow p-3 lg:p-6">
    <h2 class="text-xl font-bold mb-2">{{campaign?.title}}</h2>


    <p class="italic mb-auto text-gray-600">{{(campaign?.description || '') | truncate: 120 }}</p>


    <div>
        <span class="font-bold text-2xl">${{campaign?.currentAmount}}</span> <span class="text-gray-400 text-xs"> recaudados de {{campaign?.goalAmount | currency}}</span>
        <progress class="progress progress-primary w-full" [value]="campaign?.currentAmount"
            [max]="campaign?.goalAmount"></progress>
    </div>

    <app-button-component class="flex justify-end" label="Ver más" variant="violet"
        [rounded]="true"></app-button-component>
</div>
